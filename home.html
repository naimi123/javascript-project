<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">

    <div class="modal-content">
      <div class="modal-header">

            <input type="text" class="form-control" id="recipient-name" value="karime1235">

            <label for="message-text" class="col-form-label" >Password:</label>
            <input type="password" class="form-control"  id="pass" value="1234567">
          </div>
          <div class="mb-3">
            <label for="formFile" class="form-label">Default file input example</label>
           <input class="form-control" type="file" id="priflimage">
      </div>
        </form>
      </div>
      <div class="modal-footer">

    </div>
  </div>
</div>

<!--==========MODAL REGISTER========== ===-->


<div class="modal fade" id="register" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Login</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label" ">Username:</label>
            <input type="text" class="form-control" id="users"  placeholder="enter vouter username" required>
          </div>
          <div class="mb-3">
            <label for="message-text" class="col-form-label" >Password:</label>
            <input type="password" class="form-control"  id="pass"  placeholder="enter vouter passowrd" required>
          </div>
          <div class="mb-3">
            <label for="message-text" class="col-form-label" >Email:</label>
            <input type="email" class="form-control"  id="email"  placeholder="enter vouter email">
          </div>
          <div class="mb-3">
            <label for="message-text" class="col-form-label" >name:</label>
            <input type="text" class="form-control"  id="name" required placeholder="enter vouter email">
            
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" id="btnregister" class="btn btn-success mx-2">Register</button>
        
      </div>
    </div>
  </div>
</div>

               <span class="input-group-text">With textarea</span>
        <textarea id="text-input" class="form-control" aria-label="With textarea"></textarea>
         </div>
         <div class="mb-3">
  <label for="formFile" class="form-label"></label>
  <input class="form-control" type="file" id="formFile">
</div>
        </form>

        <button type="button" id="btncraet" class="btn btn-primary mx-2">create</button>
